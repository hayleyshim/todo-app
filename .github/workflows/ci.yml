name: CI

# app/ 의 Vite 빌드 + Playwright E2E 를 자동 실행
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app # 앱은 서브폴더에 있음

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Vite 8 요구사항(20.19+/22.12+) 충족
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        # npm ci(엄격 일치) 대신 npm install 사용:
        # @emnapi 등 플랫폼별 optional 의존성은 macOS에서 만든 lock에
        # Linux용 항목이 빠질 수 있어 npm ci가 실패함. install은 자동 보완.
        run: npm install --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
